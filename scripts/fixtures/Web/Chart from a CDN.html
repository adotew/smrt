<!doctype html>
<!-- Loads Chart.js from the network; offline, the fallback text shows instead. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Training Loss</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <style>
      body {
        font: 16px/1.5 system-ui, sans-serif;
        max-width: 800px;
        margin: 48px auto;
        padding: 0 24px;
      }
      label {
        display: block;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Training loss</h1>
    <canvas id="chart" height="120"></canvas>
    <p id="offline" hidden>Chart.js couldn't load. Are you offline?</p>
    <label>Learning rate: <input id="rate" type="range" min="1" max="20" value="8" /> <output id="value"></output></label>
    <script>
      const steps = Array.from({ length: 60 }, (_, i) => i * 500);
      const loss = (rate) => steps.map((_, i) => 4 * Math.exp((-rate * i) / 300) + 1.6 + Math.sin(i * 1.3) * 0.04);
      const rate = document.getElementById("rate");
      const value = document.getElementById("value");

      if (!window.Chart) {
        document.getElementById("offline").hidden = false;
      } else {
        const chart = new Chart(document.getElementById("chart"), {
          type: "line",
          data: { labels: steps, datasets: [{ label: "Loss", data: loss(rate.value), borderColor: "#6366f1", pointRadius: 0, tension: 0.3 }] },
          options: { animation: { duration: 300 }, scales: { x: { title: { display: true, text: "Step" } } } },
        });
        rate.oninput = () => {
          value.textContent = `${rate.value}e-4`;
          chart.data.datasets[0].data = loss(rate.value);
          chart.update();
        };
      }
      value.textContent = `${rate.value}e-4`;
    </script>
  </body>
</html>
